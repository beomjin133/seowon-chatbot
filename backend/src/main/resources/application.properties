spring.application.name=chatbotProject

# 실제 비밀값은 커밋되지 않는 application-local.properties 에 두거나 환경변수로 주입한다.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chatbot}?useSSL=false&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# ai 모듈의 RAG 서버 주소. 배포 환경에서는 AI_CHAT_URL로 실제 주소를 주입한다.
ai.chat.url=${AI_CHAT_URL:http://localhost:8000/chat}

# CORS 허용 오리진(콤마 구분). 배포 시 실제 프론트엔드 주소로 좁힐 것.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

jwt.secret=${JWT_SECRET}
jwt.token-validity-in-seconds=3600

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
